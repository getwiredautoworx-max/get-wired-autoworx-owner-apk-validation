plugins { id 'com.android.application' }
android {
    namespace 'za.co.getwiredautoworx.owner'
    compileSdk 35
    defaultConfig {
        applicationId 'za.co.getwiredautoworx.owner'
        minSdk 23
        targetSdk 35
        versionCode 3
        versionName '1.0.2'
    }
    signingConfigs {
        release {
            def ks = System.getenv('RELEASE_KEYSTORE')
            def sp = System.getenv('RELEASE_STORE_PASSWORD')
            def kp = System.getenv('RELEASE_KEY_PASSWORD')
            def ka = System.getenv('RELEASE_KEY_ALIAS')
            if (ks && sp && kp && ka) {
                storeFile file(ks)
                storePassword sp
                keyAlias ka
                keyPassword kp
            }
        }
    }
    buildTypes {
        release {
            signingConfig signingConfigs.release
            minifyEnabled false
        }
    }
}
