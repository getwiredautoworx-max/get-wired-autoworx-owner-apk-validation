name: Build Owner APK
on:
  push:
    branches:
      - main
      - ci-actions-check-20260929
    paths-ignore:
      - 'HANDOVER.md'
      - 'ALTERNATE_TASKS_EXECUTION_STATUS.md'
  pull_request:
    branches:
      - main
  workflow_dispatch:
permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - name: Build debug APK
        run: gradle --version && gradle assembleDebug
      - name: Record APK checksum
        run: sha256sum app/build/outputs/apk/debug/*.apk | tee apk-sha256.txt
      - uses: actions/upload-artifact@v4
        with:
          name: get-wired-owner-debug
          path: |
            app/build/outputs/apk/debug/*.apk
            apk-sha256.txt

  emulator:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - name: Build debug APK for emulator
        run: gradle assembleDebug
      - name: Run Android emulator smoke test
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 29
          target: google_apis
          arch: x86_64
          force-avd-creation: true
          startup-timeout: 240
          emulator-options: -no-window -no-audio -no-boot-anim -gpu swiftshader_indirect
          disable-animations: true
          script: |
            adb wait-for-device
            adb start-server
            adb devices
            adb wait-for-device
            adb shell getprop sys.boot_completed
            adb shell settings put global window_animation_scale 0
            adb shell settings put global transition_animation_scale 0
            adb shell settings put global animator_duration_scale 0
            adb push app/build/outputs/apk/debug/app-debug.apk /data/local/tmp/get-wired-owner.apk
            adb shell pm install -r /data/local/tmp/get-wired-owner.apk
            adb shell pm path za.co.getwiredautoworx.owner
            adb shell monkey -p za.co.getwiredautoworx.owner 1
            sleep 8
            adb shell dumpsys activity activities | grep -q za.co.getwiredautoworx.owner

  signed-release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - name: Generate temporary CI signing key
        shell: bash
        run: |
          set -euo pipefail
          STORE_PASS="$(openssl rand -hex 24)"
          KEY_PASS="$(openssl rand -hex 24)"
          echo "RELEASE_STORE_PASSWORD=$STORE_PASS" >> "$GITHUB_ENV"
          echo "RELEASE_KEY_PASSWORD=$KEY_PASS" >> "$GITHUB_ENV"
          echo "RELEASE_KEY_ALIAS=get-wired-ci" >> "$GITHUB_ENV"
          echo "RELEASE_KEYSTORE=$PWD/app/ci-release.keystore" >> "$GITHUB_ENV"
          keytool -genkeypair -v -storetype JKS -keystore "$PWD/app/ci-release.keystore" -storepass "$STORE_PASS" -keypass "$KEY_PASS" -alias get-wired-ci -keyalg RSA -keysize 2048 -validity 3650 -dname "CN=Get Wired AutoWorx, OU=Owner App, O=Get Wired AutoWorx, L=Durban, ST=KwaZulu-Natal, C=ZA"
      - name: Build signed release APK
        run: gradle assembleRelease
      - name: Verify APK signature
        run: apksigner verify --verbose app/build/outputs/apk/release/*.apk
      - name: Record signed APK checksum
        run: sha256sum app/build/outputs/apk/release/*.apk | tee signed-apk-sha256.txt
      - uses: actions/upload-artifact@v4
        with:
          name: get-wired-owner-signed-release
          path: |
            app/build/outputs/apk/release/*.apk
            signed-apk-sha256.txt
