name: Build Owner APK
on:
  push:
    branches:
      - main
      - ci-actions-check-20260929
    paths-ignore:
      - 'HANDOVER.md'
      - 'ALTERNATE_TASKS_EXECUTION_STATUS.md'
  pull_request:
    branches:
      - main
  workflow_dispatch:
permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - name: Build debug APK
        run: gradle --version && gradle assembleDebug
      - name: Record APK checksum
        run: sha256sum app/build/outputs/apk/debug/*.apk | tee apk-sha256.txt
      - uses: actions/upload-artifact@v4
        with:
          name: get-wired-owner-debug
          path: |
            app/build/outputs/apk/debug/*.apk
            apk-sha256.txt

  emulator:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - name: Build debug APK for emulator
        run: gradle assembleDebug
      - name: Run Android emulator smoke test
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 33
          target: google_apis
          arch: x86_64
          profile: pixel_2
          force-avd-creation: true
          emulator-options: -no-window -no-audio -no-boot-anim -gpu swiftshader_indirect
          disable-animations: true
          script: |
            adb wait-for-device
            adb shell settings put global window_animation_scale 0
            adb shell settings put global transition_animation_scale 0
            adb shell settings put global animator_duration_scale 0
            adb push app/build/outputs/apk/debug/app-debug.apk /data/local/tmp/get-wired-owner.apk
            adb shell pm path za.co.getwiredautoworx.owner || true
            for attempt in 1 2 3 4; do
              adb shell pm install -r /data/local/tmp/get-wired-owner.apk && break
              adb kill-server || true
              sleep 2
              adb start-server || true
              sleep 2
            done
            adb shell monkey -p za.co.getwiredautoworx.owner 1
            sleep 8
            adb shell dumpsys activity activities | grep -q za.co.getwiredautoworx.owner
